[package]
name = "glia-sdk"
version = "0.1.0"
edition = "2021"
authors = ["ZEA Platform <dev@zea.cl>"]
license = "MIT"
description = "Official Rust Client SDK for the ZEA Glia ReAct Agent Platform"
repository = "https://github.com/ZeaCl/glia-sdk-rust"

[lib]
name = "glia_sdk"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
async-trait = "0.1"
url = "2.5"
log = "0.4"

[dev-dependencies]
tokio-test = "0.4"
